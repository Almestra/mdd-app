name: mdd
services:
  mysql:
    image: 'mysql:9.7.4'
    environment:
      - 'MYSQL_DATABASE=${MYSQL_DATABASE}'
      - 'MYSQL_USER=${MYSQL_USER}'
      - 'MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}'
      - 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}'
    ports:
      - '127.0.0.1::3306'
    volumes:
      - 'mysql_data:/var/lib/mysql'
volumes:
  mysql_data:
